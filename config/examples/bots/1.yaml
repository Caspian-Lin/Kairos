# 用登录 NapCat 的 QQ 号替换占位号。
self_id: 10000000000000001
nickname: 林小满
profile_type: social_companion
persona_prompt: |
  我是林小满，平时喜欢聊做饭、游戏和显卡。群里说话简短随意，接得上话题就聊两句。
# llm.chat 决定这个 Bot 用哪个模型回复。密钥放在 .env，在这里引用变量名。
llm:
  # Google AI Studio 用 x-goog-api-key 鉴权，发送 contents 和 systemInstruction 到
  # POST /v1beta/models/<model>:generateContent。
  chat:
    provider: google_ai_studio
    api_format: gemini_generate_content
    model: gemini-3.5-flash-lite
    api_key: "${GEMINI_API_KEY}"
    thinking_level: minimal

  # 切换服务商时，从下面选一段替换上面的 chat 配置。
  # OpenAI Responses 用 Bearer 密钥鉴权，发送 input 到 POST /v1/responses。
  # chat:
  #   provider: openai
  #   api_format: openai_responses
  #   model: gpt-4o-mini
  #   api_key: "${OPENAI_API_KEY}"
  #
  # OpenAI Chat Completions 用 Bearer 密钥鉴权，发送 messages 到 POST /v1/chat/completions。
  # chat:
  #   provider: openai
  #   api_format: openai_chat_completions
  #   model: gpt-4o-mini
  #   api_key: "${OPENAI_API_KEY}"
  #
  # Anthropic Messages 用 x-api-key 鉴权，发送 system 和 messages 到 POST /v1/messages。
  # chat:
  #   provider: anthropic
  #   api_format: anthropic_messages
  #   model: claude-sonnet-5-5
  #   api_key: "${ANTHROPIC_API_KEY}"
  #
  # OpenCode Go 用 Bearer 密钥和独立的群聊会话 ID，model 填 API 模型 ID，如 kimi-k3。
  # 在 https://opencode.ai/inference/go 下按 api_format 使用对应路径。
  # openai_chat_completions  /openai/v1/chat/completions
  # openai_responses         /openai/v1/responses
  # anthropic_messages       /anthropic/v1/messages
  # gemini_generate_content  /google/v1beta/models/<model>:generateContent
  # chat:
  #   provider: opencode_go
  #   api_format: openai_chat_completions
  #   model: kimi-k3
  #   api_key: "${OPENCODE_GO_API_KEY}"
  #
  # 自定义 OpenAI 兼容服务需要 base_url，写到 API 版本，如 /v1。
  # chat:
  #   provider: openai_compatible
  #   api_format: openai_chat_completions
  #   base_url: https://your-provider.example/v1
  #   model: your-model-id
  #   api_key: "${CUSTOM_LLM_API_KEY}"

  # 启用初筛时，添加 gate 模型并设置下方的 gate_model_key。
