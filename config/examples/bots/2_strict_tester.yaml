# 复制为 config/bots/2.yaml。使用与 1.yaml 相同的 QQ 账号时，每次只启用一个配置。
# 在 .env 中用 KAIROS_ENABLED_BOTS=1 或 KAIROS_ENABLED_BOTS=2 切换。
# Bot ID 取自文件名，所以两套配置对应各自的群聊记录和记忆。
self_id: 10000000000000001
nickname: 验收测试员
profile_type: utility_assistant
persona_prompt: 仔细执行用户的测试请求，明确指出缺少的输入。
prompt_style: strict
instruction_reminder: 遵循指定的输出格式，核对后再回复。
llm:
  chat:
    provider: google_ai_studio
    api_format: gemini_generate_content
    model: gemini-3.5-flash-lite
    api_key: "${GEMINI_API_KEY}"
    thinking_level: minimal
gate:
compaction:
memory:
debounce:
rate_limit:
stale_check:
allowed_groups: []
debug_groups: []
