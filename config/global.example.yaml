postgres:
  dsn: "${KAIROS_PG_DSN}"

onebot_ws:
  host: 127.0.0.1
  # Kairos listens here for NapCat reverse WebSocket connections.
  port: 8080
  path: /onebot/v11/ws
  access_token: "${KAIROS_ONEBOT_ACCESS_TOKEN}"

logging:
  level: INFO
  json_format: false

admin_ui:
  enabled: false
  host: 127.0.0.1
  port: 8081
